name: Update Climate Data

on:
  schedule:
    # Run daily at 6 AM KST (21:00 UTC on the previous day)
    - cron: '0 21 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: update-climate-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure CDS API credentials
        run: |
          mkdir -p ~/.config/cdsapi
          cat > ~/.cdsapirc << EOF
          url: ${{ secrets.CDS_URL }}
          key: ${{ secrets.CDS_KEY }}
          EOF

      - name: Update data and generate images
        env:
          CDS_API_KEY: ${{ secrets.CDS_KEY }}
          CDS_API_URL: ${{ secrets.CDS_URL }}
        run: |
          python run.py update --force

      - name: Update ERA5 spatial data (current month)
        run: |
          python -c "
          from src.precompute_monthly_stats import download_current_month_mtd, precompute_current_month
          download_current_month_mtd(force=True)
          precompute_current_month()
          "
        continue-on-error: true   # Don't fail the whole workflow if CDS is slow/unavailable

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Refresh climate data for scheduled dashboard updates" \
            -m "Constraint: Runs unattended from GitHub Actions at 06:00 KST." \
            -m "Confidence: medium" \
            -m "Scope-risk: narrow" \
            -m "Directive: Keep generated data files committed so Vercel can serve the latest bundle after push." \
            -m "Tested: GitHub Actions completed the data update command before this commit." \
            -m "Not-tested: Source availability may vary by upstream provider on each run."
          git pull --rebase
          git push
