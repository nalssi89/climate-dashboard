name: Update Climate Data

on:
  schedule:
    # Sync upstream data daily at 6 AM KST (21:00 UTC on the previous day)
    - cron: '0 21 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-climate-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-vercel.txt

      - name: Sync upstream committed data artifacts
        run: |
          git remote add upstream https://github.com/hausfath/climate-dashboard.git || git remote set-url upstream https://github.com/hausfath/climate-dashboard.git
          git fetch upstream main --prune

          git rm -r --ignore-unmatch \
            assets/images \
            data/cmip \
            ENSO/data/observed \
            ENSO/data/forecasts

          git rm --ignore-unmatch \
            data/enso_forecast_updates.csv \
            data/last_enso_forecast_snapshot.csv \
            data/last_iri_snapshot.csv \
            data/projection_history_2026.csv \
            data/era5/precomputed/monthly_stats.csv

          git checkout upstream/main -- \
            assets/images \
            data/cmip \
            data/enso_forecast_updates.csv \
            data/last_enso_forecast_snapshot.csv \
            data/last_iri_snapshot.csv \
            data/projection_history_2026.csv \
            data/era5/precomputed/monthly_stats.csv \
            ENSO/data/observed \
            ENSO/data/forecasts

      - name: Refresh lightweight ERA5 daily cache
        run: |
          python - <<'PY'
          from config import DATA_SOURCES
          from src.scraper import fetch_era5_data

          source = DATA_SOURCES["era5_global"]
          fetch_era5_data(source["url"], source["local_file"])
          PY

      - name: Stage generated deployment data
        id: git-check
        run: |
          git add \
            assets/images \
            data/era5_daily_series_2t_global.csv \
            data/projection_history_*.csv \
            data/enso_forecast_updates.csv \
            data/last_enso_forecast_snapshot.csv \
            data/last_iri_snapshot.csv \
            ENSO/data/observed \
            ENSO/data/forecasts
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Refresh climate data for scheduled dashboard updates" \
            -m "Constraint: Runs unattended from GitHub Actions at 06:00 KST and mirrors upstream committed data artifacts." \
            -m "Confidence: medium" \
            -m "Scope-risk: narrow" \
            -m "Directive: Keep this workflow focused on syncing upstream data artifacts; preserve Vercel-specific app files in this fork." \
            -m "Tested: GitHub Actions completed the upstream sync and ERA5 cache refresh before this commit." \
            -m "Not-tested: Upstream availability may vary on each scheduled run."
          git pull --rebase
          git push
